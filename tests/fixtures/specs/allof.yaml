openapi: 3.0.3
info: {title: Composicao, version: "1"}
security:
  - bearerAuth: []
paths:
  /pacientes:
    post:
      operationId: criarPaciente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/Base"
                - type: object
                  required: [cpf]
                  properties:
                    cpf: {type: string, minLength: 11, maxLength: 11}
      responses:
        "201":
          description: criado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Base"
                  - type: object
                    properties:
                      id: {type: integer, format: int64}
  /pacientes/{pacienteId}:
    get:
      operationId: buscarPaciente
      security: []
      parameters:
        - $ref: "#/components/parameters/PacienteId"
      responses: {"200": {description: ok}}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer}
  parameters:
    PacienteId: {name: pacienteId, in: path, required: true, schema: {type: integer, format: int64}}
  schemas:
    Base:
      type: object
      required: [nome]
      properties:
        nome: {type: string, minLength: 3, maxLength: 20}
