openapi: 3.1.0
info: {title: Tres um, version: 1.0}
paths:
  /itens:
    post:
      operationId: criarItem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [codigo, quantidade]
              properties:
                codigo: {type: [string, "null"], minLength: 4, maxLength: 4}
                quantidade: {type: integer, exclusiveMinimum: 0, maximum: 5}
                tipo: {const: "A"}
                data: {type: string, format: date, example: 2020-01-01}
      responses: {"201": {description: ok}}
