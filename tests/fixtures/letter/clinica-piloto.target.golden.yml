# Gerado por: hdast init <produto> --from-letter <carta.yml> (ADR 0036).
# Blocos gerados da carta (o agente não os escreve nem os altera): environment, openapi, scope, limits, auth, scan.strength.
# Para mudar algum deles, a pessoa muda a carta e o perfil é gerado de novo.
schema_version: 1
product: "clinica-piloto"
environment:
  name: "lab"
  base_url: "http://clinica-piloto:8080"
openapi: "./openapi.json"
scope:
  allow:
    - host: "clinica-piloto"
      scheme: "http"
      port: 8080
      allow_local: true
      paths:
        - "/api/**"
        - "/v3/api-docs"
      methods:
        - "GET"
        - "PATCH"
        - "POST"
        - "PUT"
  deny_paths:
    - "/api/notificacoes/**"
    - "/api/isca/**"
  authorization:
    reference: "LAB-CLINICA-PILOTO"
    valid_until: 2027-12-31
  path_mode: "strict"
  windows:
    - "seg-dom 00:00-24:00 America/Sao_Paulo"
limits:
  requests_per_second: 50
  max_duration_minutes: 30
  zap_threads_per_host: 8
auth:
  type: "login_password"
  token_path: "/api/auth/login"
  request_encoding: "json"
  login_limit:
    max_per_minute: 5
  accounts:
    - alias: "admin_a"
      role: "admin"
      username:
        secret_ref: "env:PILOT_ADMIN_USERNAME"
      password:
        secret_ref: "env:PILOT_ADMIN_PASSWORD"
    - alias: "paciente_a"
      role: "paciente"
      username:
        secret_ref: "env:PILOT_PACIENTE_A_USERNAME"
      password:
        secret_ref: "env:PILOT_PACIENTE_A_PASSWORD"
    - alias: "paciente_b"
      role: "paciente"
      username:
        secret_ref: "env:PILOT_PACIENTE_B_USERNAME"
      password:
        secret_ref: "env:PILOT_PACIENTE_B_PASSWORD"
scan:
  strength: "LOW"
