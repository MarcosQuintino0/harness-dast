name: ci

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Análise estática
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run lint-imports
      - run: uv run vulture

  security:
    name: Segurança
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # O gitleaks lista os commits do pull request pela API; sem esta leitura ele falha com
    # "Resource not accessible by integration" em evento pull_request.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --locked
      # Audita as versões travadas no uv.lock, não o ambiente do runner.
      - run: uv export --locked --no-emit-project --format requirements-txt -o requirements-audit.txt
      - run: uv run pip-audit --requirement requirements-audit.txt --no-deps --disable-pip

  tests:
    name: Testes unitários e de contrato
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --locked
      - run: uv run pytest tests/unit tests/contract --cov --cov-report=xml --cov-report=json
      # Pisos por camada: domain 95% e application 85% (ramos). Ignora camada sem código.
      - run: >-
          uv run python .github/scripts/check_coverage_floors.py coverage.json
          src/harness_dast/domain=95 src/harness_dast/application=85
      - name: Cobertura do diff (mínimo 90%)
        if: github.event_name == 'pull_request'
        run: >-
          uv run diff-cover coverage.xml
          --compare-branch=origin/${{ github.base_ref }} --fail-under=90

  integration:
    name: Integração
    # Integração é manual: requer Docker e imagens ZAP, socat, VAmPI, proxy, piloto e Oracle.
    # A preparação abaixo falha se build/pull/inspect falhar; não aceitar coleta vazia como sucesso.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --locked
      - name: Construir imagens locais do proxy e da Clínica Piloto
        run: |
          docker build -t hdast/scope-proxy:local -f docker/scope-proxy/Dockerfile .
          docker build -t hdast-clinica-piloto:1.0.0 lab/pilot
      - name: Baixar e conferir imagens das integrações
        # Imagens seguem as referências dos compose; nenhuma pilha é iniciada nesta preparação.
        run: |
          docker info
          docker pull zaproxy/zap-stable:2.17.0@sha256:9624669db72f54d86c4b46a7064518bd9bf79d8c61a4c31befa9923489f328af
          docker pull alpine/socat:1.8.1.3@sha256:e8a6e8868a8e6e01d9c2c321a8f8d4474d2d741d962462e5c5a124a8e66a0055
          docker pull erev0s/vampi:latest@sha256:0a5a224b6e14ae7da6a6ea265178ff71286ff903aec74adee98f660bb0e4ca12
          docker pull gvenzl/oracle-free:23-slim-faststart@sha256:f5ff19033860d662c821cb04eb10483fa94f14f78eae252d054291ea07028093
          docker tag gvenzl/oracle-free@sha256:f5ff19033860d662c821cb04eb10483fa94f14f78eae252d054291ea07028093 gvenzl/oracle-free:23-slim-faststart
          docker image inspect hdast/scope-proxy:local hdast-clinica-piloto:1.0.0 gvenzl/oracle-free:23-slim-faststart
      - name: Rodar integração (nenhum teste coletado é falha)
        run: uv run pytest -m integration

  windows:
    name: Unitários e contratos no Windows
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --locked
      - run: uv run pytest tests/unit tests/contract
