name: Imagens Docker

on:
  # Só por tag v*: o disparo manual permitiria publicar a partir de qualquer branch.
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  publish:
    name: Publicar ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        include:
          - image: ghcr.io/marcosquintino0/hdast-zap
            context: docker/zap
            file: docker/zap/Dockerfile
            check_package_version: false
          - image: ghcr.io/marcosquintino0/hdast-scope-proxy
            context: .
            file: docker/scope-proxy/Dockerfile
            check_package_version: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Conferir a versão do pacote
        id: package
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import re
          import tomllib

          with open('pyproject.toml', 'rb') as package:
              version = tomllib.load(package)['project']['version']
          if not re.fullmatch(r'[0-9][A-Za-z0-9_.-]{0,127}', version):
              raise SystemExit('A versão do pacote precisa ser válida como tag Docker.')
          ref = os.environ['GITHUB_REF']
          if ref != f'refs/tags/v{version}':
              raise SystemExit(f'A tag Git deve ser v{version}, conforme pyproject.toml.')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'version={version}\n')
          PY
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ matrix.image }}:${{ steps.package.outputs.version }}
          labels: |
            org.opencontainers.image.version=${{ steps.package.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          build-args: >-
            ${{ matrix.check_package_version && format('HDAST_IMAGE_VERSION={0}', steps.package.outputs.version) || '' }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
