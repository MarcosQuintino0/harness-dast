# Ambiente de contêineres do harness-dast. Implementa a camada 3 de AD-11:
# o ZAP não tem rota para fora; tudo que ele envia ao alvo passa pelo proxy de
# saída (Squid), que nega por padrão e só permite os hosts da lista.
#
# Uso (veja lab/README.md):
#   export HDAST_ZAP_API_KEY="$(openssl rand -hex 24)"   # obrigatória, sem padrão
#   docker compose up -d                  # zap + egress-proxy (+ zap-gateway)
#   docker compose --profile lab up -d    # inclui o alvo de laboratório (VAmPI)
#   docker compose --profile lab down     # parada
#
# Imagens fixadas por tag E digest (digest do índice multi-arquitetura, lido no
# Docker Hub e conferido no pull). Atualizar = trocar tag e digest num PR.

name: hdast

services:
  # ---------------------------------------------------------------- ZAP
  zap:
    # Fonte: https://www.zaproxy.org/docs/docker/about/ (imagem estável oficial)
    image: zaproxy/zap-stable:2.17.0@sha256:9624669db72f54d86c4b46a7064518bd9bf79d8c61a4c31befa9923489f328af
    # Execução como usuário "zap" (não root), como a documentação oficial.
    user: zap
    environment:
      # Sem valor padrão de propósito: uma chave embutida no repositório seria
      # uma chave conhecida por todos. Falha com mensagem clara se ausente.
      HDAST_ZAP_API_KEY: "${HDAST_ZAP_API_KEY:?Defina HDAST_ZAP_API_KEY (chave da API do ZAP) antes de subir o compose, por exemplo com openssl rand -hex 24}"
    # -daemon: sem interface gráfica. -silent: "garante que o ZAP não faça
    #   requisições não solicitadas, inclusive a verificação de atualizações"
    #   (texto do zap.sh -cmd -help da 2.17.0).
    # api.key: toda chamada à API exige a chave.
    # api.addrs: o ZAP só aceita clientes cujo IP combine com a regex; aqui
    #   qualquer IP, porque o único caminho até a porta é a rede interna do
    #   compose (zap-gateway), não a rede do host.
    # network.connection.httpProxy.*: proxy de saída (upstream) do ZAP; todo o
    #   tráfego dirigido ao alvo vai para o egress-proxy (verificado: o
    #   accessUrl da API do ZAP aparece no registro do Squid). Chaves em
    #   https://github.com/zaproxy/zap-extensions/blob/main/addOns/network/src/main/java/org/zaproxy/addon/network/ConnectionOptions.java
    # Nenhuma exclusão de proxy (exclusions) é configurada: nenhum host
    #   contorna o egress-proxy.
    command:
      - sh
      - -c
      - >-
        exec zap.sh -daemon -silent -host 0.0.0.0 -port 8080
        -config api.key="$$HDAST_ZAP_API_KEY"
        -config api.addrs.addr.name=.*
        -config api.addrs.addr.regex=true
        -config network.connection.httpProxy.enabled=true
        -config network.connection.httpProxy.host=egress-proxy
        -config network.connection.httpProxy.port=3128
    healthcheck:
      # Chama a API com a chave: prova que o daemon subiu E que a API responde.
      test: ["CMD-SHELL", "curl -fsS -o /dev/null \"http://127.0.0.1:8080/JSON/core/view/version/?apikey=$$HDAST_ZAP_API_KEY\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - zap_net            # interna: única rede do ZAP, sem rota para fora
    depends_on:
      egress-proxy:
        condition: service_healthy
    # --- endurecimento
    restart: "no"
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    tmpfs:
      # O ZAP grava sessão, configuração e logs em /home/zap e /zap/wrk.
      - /home/zap:uid=1000,gid=1000,mode=0700,size=512m
      - /zap/wrk:uid=1000,gid=1000,mode=0700,size=256m
      - /tmp:mode=0755,size=64m

  # ------------------------------------------------- Ponte host -> ZAP
  # Contêiner em rede interna não é alcançável por porta publicada no Docker
  # Desktop. Este encaminhador TCP mínimo (socat, destino fixo zap:8080) fica
  # em duas redes: a interna (fala com o ZAP) e a host_net (onde a porta é
  # publicada, somente em 127.0.0.1). O ZAP continua sem rota externa. Ver
  # lab/README.md, seção "O que o isolamento garante e não garante".
  zap-gateway:
    # Fonte: https://hub.docker.com/r/alpine/socat
    image: alpine/socat:1.8.1.3@sha256:e8a6e8868a8e6e01d9c2c321a8f8d4474d2d741d962462e5c5a124a8e66a0055
    user: "65534:65534"   # nobody; a porta 8080 é acima de 1024, não precisa de root
    command: ["TCP-LISTEN:8080,fork,reuseaddr", "TCP:zap:8080"]
    ports:
      # Somente loopback do host: a API e o proxy do ZAP nunca saem da máquina.
      - "127.0.0.1:${HDAST_ZAP_HOST_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8080"]
      interval: 10s
      timeout: 3s
      retries: 6
    networks:
      - zap_net
      - host_net
    depends_on:
      zap:
        condition: service_healthy
    restart: "no"
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true

  # -------------------------------------------------------- Proxy de saída
  egress-proxy:
    # Fonte: https://hub.docker.com/r/ubuntu/squid (Canonical)
    image: ubuntu/squid:6.6-24.04_edge@sha256:8a3baed477e2c282ab8aa5edad442f69873246964f225c5c2ae8364b6610963c
    # Usuário "proxy" (uid/gid 13) desde o início: com isso o Squid sobe sem
    # nenhuma capability (verificado). O padrão da imagem é root + SETUID/SETGID.
    user: "13:13"
    volumes:
      - ./docker/egress-proxy/squid.conf:/etc/squid/squid.conf:ro
      # Lista de hosts/portas: arquivos que o harness regenera por execução.
      - ./docker/egress-proxy/policy:/etc/squid/policy:ro
    healthcheck:
      # "squid -k check" sinaliza o processo mestre pelo arquivo de PID (rc 0 =
      # vivo). Evita abrir conexão na porta 3128, que gravaria uma linha de
      # erro (NONE_NONE) no registro a cada checagem.
      test: ["CMD-SHELL", "squid -k check -f /etc/squid/squid.conf >/dev/null 2>&1"]
      interval: 5s
      timeout: 4s
      retries: 10
      start_period: 5s
    networks:
      zap_net: {}          # lado do ZAP (interna)
      lab_net: {}          # lado do alvo do lab (interna)
      egress_net: {}       # única rede com rota para fora
    restart: "no"
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    tmpfs:
      # uid/gid 13 = usuário "proxy" do Ubuntu, sob o qual o Squid roda.
      # Gravável só por ele; o rootfs é somente leitura e o log some no down.
      - /var/run/squid:uid=13,gid=13,mode=0755
      - /var/spool/squid:uid=13,gid=13,mode=0755
      - /var/log/squid:uid=13,gid=13,mode=0755

  # ------------------------------------------------------------ Lab (alvo)
  vampi:
    profiles: ["lab"]
    user: "65534:65534"   # nobody; o VAmPI só precisa ler o código e gravar o SQLite em tmpfs
    # Fonte: https://hub.docker.com/r/erev0s/vampi (única tag publicada: latest)
    image: erev0s/vampi:latest@sha256:0a5a224b6e14ae7da6a6ea265178ff71286ff903aec74adee98f660bb0e4ca12
    environment:
      # 1 = vulnerável (padrão), 0 = seguro. Os testes usam os dois modos.
      # Fonte: https://github.com/erev0s/VAmPI#readme
      vulnerable: ${HDAST_VAMPI_VULNERABLE:-1}
      tokentimetolive: ${HDAST_VAMPI_TOKEN_TTL:-300}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:5000/', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    networks:
      - lab_net            # interna: só o egress-proxy a alcança
    restart: "no"
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    tmpfs:
      - /tmp
      - /vampi/database:uid=65534,gid=65534,mode=0755

# Redes
#  zap_net    internal: sem rota para fora; ZAP, proxy e ponte.
#  lab_net    internal: proxy e VAmPI; o ZAP não está nela.
#  egress_net comum: só o egress-proxy; é por onde um produto real seria alcançado.
#  host_net   comum: só a ponte, para publicar a porta em 127.0.0.1.
networks:
  zap_net:
    internal: true
  lab_net:
    internal: true
  egress_net: {}
  host_net: {}
