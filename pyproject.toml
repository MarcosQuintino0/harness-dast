[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[project]
name = "harness-dast"
version = "1.12.2"
description = "Ferramenta interna para testes de segurança (DAST) autorizados em APIs, conduzida por um agente de IA e executada por uma CLI determinística."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.29",
    "pydantic>=2.14",
    "pydantic-settings>=2.16",
    "structlog>=26.1",
    "tzdata>=2025.2",
    "pyyaml>=6.0",
    "httpx>=0.28.1",
    "oracledb>=3.4",
    "keyring>=25.7",
]

[project.scripts]
hdast = "harness_dast.cli.app:main"

[dependency-groups]
dev = [
    "ruff>=0.17",
    "mypy>=2.4",
    "pytest>=9.2",
    "pytest-cov>=7.1",
    "hypothesis>=6.170",
    "import-linter>=2.16",
    "vulture>=2.16",
    "diff-cover>=11.0",
    "pip-audit>=2.10",
    "pre-commit>=4.7",
    "commitizen>=4.19",
    "types-pyyaml>=6.0",
]

[tool.uv]
default-groups = ["dev"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "."]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "N",       # pep8-naming
    "UP",      # pyupgrade
    "B",       # bugbear
    "C90",     # complexidade ciclomática
    "S",       # bandit
    "BLE",     # except genérico
    "TRY",     # boas práticas de exceções
    "T20",     # print proibido
    "ERA",     # código comentado
    "FIX",     # TODO/FIXME
    "D",       # docstrings
    "RUF",
    "PT",      # estilo do pytest
    "SIM",
]
ignore = [
    # Os nomes da hierarquia (ex.: ScopeViolation) são vocabulário do domínio e
    # fazem parte do contrato do projeto; o sufixo Error não agrega.
    "N818",
    # A mensagem de erro de domínio é montada onde o erro é levantado, porque
    # só ali se sabe o que aconteceu e o que fazer (seção 5 do documento).
    "TRY003",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Docstrings só são exigidas no código de produção; asserts são o mecanismo do pytest.
"tests/**" = ["S101", "D"]
# O executor da avaliacao cega (evals/runner) e ferramenta interna: sem docstring obrigatoria em item publico.
"evals/**" = ["D1"]
# CSS copiado do desenho do painel (docs/desenvolver/design/execution-panel/): linhas longas de propósito, para
# a cópia continuar idêntica ao original.
"src/harness_dast/domain/panel/style.py" = ["E501"]
"src/harness_dast/domain/panel/tokens.py" = ["E501"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
files = ["src", "tests", "evals"]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true
mypy_path = "src"

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
minversion = "8.0"
markers = [
    "integration: adaptador contra a dependência real (ZAP, servidor HTTP); exige Docker",
    "contract: envelope JSON, códigos de saída e contratos de portas",
    "e2e: hdast run contra o lab; exige Docker",
    "lab_fast: nivel RAPIDO da integracao (poucos endpoints, pilha reaproveitada); exige Docker",
    "lab_full: nivel COMPLETO da integracao (todos os endpoints, politica padrao); exige Docker",
    "regressao_dirigida: roteiro nao cego e rapido que prova que H1 a H10 (Clinica) e V1 e V3 (VAmPI) seguem achadas; exige Docker",
]
# O -m padrão deixa de fora o que exige Docker. Passar -m na linha de comando
# substitui este valor (ex.: pytest -m integration).
addopts = ["--strict-markers", "--strict-config", "-m", "not integration and not e2e"]

# ------------------------------------------------------------ coverage
[tool.coverage.run]
branch = true
source = ["harness_dast"]

[tool.coverage.report]
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    '^\s*\.\.\.$',
]

# --------------------------------------------------------- import-linter
[tool.importlinter]
root_package = "harness_dast"
# Necessário para o contrato de pacotes externos do domain.
include_external_packages = true

[[tool.importlinter.contracts]]
name = "domain nao importa nenhum outro pacote do projeto"
type = "forbidden"
source_modules = ["harness_dast.domain"]
forbidden_modules = [
    "harness_dast.application",
    "harness_dast.adapters",
    "harness_dast.cli",
    "harness_dast.config",
    "harness_dast.observability",
]

# O import-linter só tem lista de proibição (não há "só estes pacotes externos"), então a
# regra "domain importa só biblioteca padrão e pydantic" é aproximada proibindo as demais
# dependências de runtime. Dependência nova de runtime deve entrar nesta lista (ADR).
[[tool.importlinter.contracts]]
name = "domain nao importa dependencias externas alem de pydantic e stdlib"
type = "forbidden"
source_modules = ["harness_dast.domain"]
forbidden_modules = ["typer", "click", "structlog", "pydantic_settings", "yaml", "tzdata", "httpx", "httpcore", "oracledb", "keyring"]

[[tool.importlinter.contracts]]
name = "application so importa domain"
type = "forbidden"
source_modules = ["harness_dast.application"]
forbidden_modules = [
    "harness_dast.adapters",
    "harness_dast.cli",
    "harness_dast.config",
    "harness_dast.observability",
]

[[tool.importlinter.contracts]]
name = "adapters nao importam cli"
type = "forbidden"
source_modules = ["harness_dast.adapters"]
forbidden_modules = ["harness_dast.cli"]

[[tool.importlinter.contracts]]
name = "config e observability nao dependem de cli, application nem adapters"
type = "forbidden"
source_modules = ["harness_dast.config", "harness_dast.observability"]
forbidden_modules = [
    "harness_dast.cli",
    "harness_dast.application",
    "harness_dast.adapters",
]

[[tool.importlinter.contracts]]
name = "adaptadores irmaos sao independentes"
type = "independence"
modules = [
    "harness_dast.adapters.openapi",
    "harness_dast.adapters.zap",
    "harness_dast.adapters.http",
    "harness_dast.adapters.datagen",
    "harness_dast.adapters.secrets",
    "harness_dast.adapters.reporting",
    "harness_dast.adapters.cleanup",
    "harness_dast.adapters.storage",
    "harness_dast.adapters.scope_proxy",
    "harness_dast.adapters.docker",
]

# --------------------------------------------------------------- vulture
[tool.vulture]
paths = ["src"]
min_confidence = 60
# Os validadores pydantic são chamados por reflexão: a exceção é por decorador, não por nome.
ignore_decorators = ["@field_validator", "@model_validator"]
# O vulture compara por NOME simples (não há como qualificar por classe); cada grupo abaixo
# existe por um motivo e deve perder a entrada quando ganhar um chamador de produção.
ignore_names = [
    # Proxy de escopo: chamados só por docker/scope-proxy/addon.py, que roda no contêiner com o
    # mitmproxy e fica fora de `paths`; `ts` e `query_params` são campos lidos pelo pydantic.
    "ScopeProxyEngine",
    "check_connect",
    "check_request",
    "recheck_after_wait",
    "reserve_slot",
    "GrantQueue",
    "defer_slots",
    "retry_after_seconds",
    "read_response_signals",
    "check_destination",
    "log",
    "ts",
    "query_params",
    "UPSTREAM_ERROR",
    "RATE_QUEUE_FULL",
    # Convenção do pydantic, lida pela biblioteca.
    "model_config",
    # Hook que o Python chama sozinho (ApprovedRequest proíbe subclasses).
    "__init_subclass__",
    # Campos de modelos que só a serialização do pydantic lê (envelope JSON, probe.json,
    # manifest.json, audit.jsonl) ou que só os testes e o agente consomem.
    "schema_version",
    # V1.7: campos públicos de metrics.json consumidos por análise externa.
    "proxy_grant_wait_seconds",
    "proxy_network_seconds",
    "cpu_seconds",
    "memory_peak_bytes",
    "requires_confirmation",
    "constraints",
    "field_name",
    "id_synthesized",
    "more_inputs",
    "optional_inputs",
    "security_schemes",
    "skipped_fields",
    "success_codes",
    "tags",
    "by_outcome",
    # Ranking público do probe, serializado pelo Pydantic para o agente (ADR 0059).
    "blocked_producers",
    "excerpt",
    "finished_at",
    "header_names",
    "needs_rule_unchecked",
    "notice",
    "query_names",
    "redirect_in_scope",
    "target_yml",
    "untrusted_target_data",
    "zap_context_id",
    "updated_at",
    # Teste de autorização (ADR 0027): campos de authz.json e exchanges.json lidos só pela
    # serialização do pydantic, pelos testes e pelo agente.
    "baseline_status",
    "observed_status",
    "omitted_fields",
    # Envio de arquivo no probe (ADR 0052): campos do resumo de multipart (exchanges.json, prévia
    # do --dry-run e spec inspect) lidos só pela serialização do pydantic e pelo agente.
    "total_bytes",
    "multipart_parts",
    "multipart_probe",
    # Limpeza (M5): campos do cleanup.json e da auditoria lidos só por quem serializa, e atributos
    # que o código atribui em objetos do driver Oracle.
    "statement_count",
    # Token do `--dry-run`: a CLI não o lê mais (ADR 0025); só os testes do caso de uso.
    "confirmation_token",
    "confirmation_method",
    "failed_statement",
    "failed_table",
    "error_code",
    "autocommit",
    "call_timeout",
    "stack_managed",
    # SSRF guiado (ADR 0100): campos de scan.json lidos só pela serialização do pydantic, pelos
    # testes e pelo agente.
    "ssrf",
    "events_seen",
    # Limite de consumo (ADR 0101): campo de scan.json lido só pela serialização do pydantic.
    "rate_checks",
    # Medição da execução (ADR 0031): campos de rule-stats.json e metrics.json lidos só pela
    # serialização do pydantic, pelos testes e por quem analisa o arquivo depois.
    "quality",
    "skip_reason",
    "rules_unavailable_reason",
    "operations_measured",
    "operations_unavailable",
    "totals",
    "gaps",
    "stages_seconds",
    "longest_seconds",
    # Painel da execução (ADR 0032): campos do modelo de visão lidos só pela serialização e pelos
    # testes.
    "functions_total",
    "owasp",
    # Sobrescritas que só estreitam (domain/overrides.py): ganham chamador quando a CLI
    # aceitar flags de redução de escopo (M4).
    "narrow_scope",
    # Painel da execução (ADR 0033, V1.2): API pública do diário e do catálogo, usada hoje só
    # pelos testes e pelo adaptador por outro caminho.
    "translated_commands",
    "catalog_entries",
    "WHO_VALUES",
    # Prévia V1.8: campos públicos do envelope JSON lidos pela serialização pydantic.
    "probe_decision",
    "body_entries_complete",
]

# ------------------------------------------------------------ commitizen
[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "uv"
tag_format = "v$version"
