# =============================================================================
# MODELO: data-rules.yml. Regras de geração de dados válidos para o produto.
#
# Schema versão 1, validado por `domain/datagen.py`. A referência campo a campo
# está em docs/reference/data-rules-yml.md.
#
# Por que existe: o ZAP, sozinho, envia valores genéricos que a API rejeita
# (400) ou que colidem com registros existentes (409). Estas regras dizem como
# gerar valores aceitos e únicos. O agente propõe as regras a partir do OpenAPI
# e dos erros do `hdast probe`; uma pessoa revisa.
#
# Todos os dados gerados são SINTÉTICOS. Nunca use dados de pessoas reais.
# =============================================================================
schema_version: 1

rules:
  # `match` escolhe onde a regra vale:
  #   field      nome do campo (`cpf`) ou caminho com pontos (`endereco.cpf`); obrigatório
  #   operation  restringe a uma operação (operationId do OpenAPI); opcional
  #   location   restringe a path, query, header, cookie ou body; opcional
  # Vale a regra MAIS ESPECÍFICA: (1) tem `operation`; (2) `field` com mais
  # segmentos; (3) tem `location`. Duas regras com o mesmo `match` são recusadas.
  #
  # `generator` escolhe o gerador do catálogo fechado; `args` o parametriza;
  # `unique: true` garante valor novo a cada requisição (evita 409) e embute a
  # etiqueta da execução no valor, para a limpeza achá-lo depois.
  # Se o harness não souber gerar um campo sozinho (por exemplo, um `pattern`
  # complexo), ele para e pede uma regra aqui em vez de adivinhar.

  # CPF válido, com dígitos verificadores, sintético.
  - match: { field: cpf }
    generator: br.cpf
    unique: true

  # Código numérico de 8 dígitos só para a operação indicada.
  - match: { operation: criarConvenio, field: codigo }
    generator: numeric
    args: { digits: 8 }
    unique: true

  # E-mail em domínio de teste, para que nada chegue a uma pessoa real.
  - match: { field: email }
    generator: email
    args: { domain: "teste.exemplo.com.br" }
    unique: true

  # Rodada 2 do probe: o alvo exige data de nascimento no passado (VALIDACAO/Past).
  - match: { field: dataNascimento }
    generator: date
    args: { min_offset_days: -365, max_offset_days: -30 }

  # Rodada 3: PUT de convênio também precisa de código novo (409 unique).
  - match: { operation: atualizarConvenio, field: codigo }
    generator: numeric
    args: { digits: 8 }
    unique: true

  # Rodada 4: CRM precisa casar \d{4,7}-[A-Z]{2} e nao repetir entre execucoes (409 unique); sorteio sintetico.
  - match: { operation: criarMedico, field: crm }
    generator: choice
    args: { values: ["3762781-MG", "5741527-RJ", "2596014-SP", "8798848-MG", "9439758-SP", "1763904-RJ", "8773812-RJ", "7740674-MG", "8936566-SP", "8857906-SP", "8004590-BA", "4856721-RJ", "4537268-BA", "3579326-MG", "7133941-MG", "2666217-SP", "5022580-SP", "3159007-SP", "4034237-SP", "1494757-BA", "8368568-MG", "3677721-SP", "6432998-RJ", "3074716-MG", "7023586-SP", "8608298-BA", "8342671-RJ", "4474111-SP", "4218409-RJ", "5209782-BA", "3431841-RJ", "3782155-BA", "5250697-BA", "2913254-MG", "2674017-BA", "1339221-MG", "3466829-SP", "1087768-MG", "1375096-SP", "1855219-BA", "3164796-BA", "7007819-BA", "7497671-RJ", "7375758-MG", "2921870-SP", "6210323-RJ", "7775503-MG", "7323238-SP", "2279186-SP", "4266062-MG", "7753869-SP", "7537044-RJ", "1825309-RJ", "2440710-SP", "6226536-BA", "3904521-BA", "1319930-SP", "2133392-RJ", "1022551-RJ", "1824074-MG"] }

  # Rodada 5: consulta exige dataHora no futuro (VALIDACAO/Future).
  - match: { field: dataHora }
    generator: datetime
    args: { min_offset_days: 2, max_offset_days: 30 }

  # Rodada 6: transicao de status valida (AGENDADA -> REALIZADA); o primeiro valor do enum dava TRANSICAO_INVALIDA.
  - match: { operation: atualizarStatusConsulta, field: status }
    generator: constant
    args: { value: REALIZADA }
