# Proxy de saída do harness-dast (camada 3 de AD-11). Squid como forward proxy
# com política "negar por padrão". Documentação: docker/egress-proxy/README.md
# Referência de diretivas: http://www.squid-cache.org/Doc/config/
#
# ESTE ARQUIVO É FIXO. A política por execução vive em policy/ (arquivos que o
# harness regenera a partir do escopo do produto); aqui só ficam as regras.

http_port 3128

# Sem cache: proxy de segurança não deve guardar respostas do alvo em disco.
cache deny all
# Nome visível fixo, sem vazar o hostname do contêiner.
visible_hostname egress-proxy
# Não revelar a origem interna nem a presença de proxy ao alvo.
forwarded_for delete
via off
httpd_suppress_version_string on

# ---------------------------------------------------------------- Registro
# Todo pedido, permitido ou negado, gera uma linha: instante, cliente,
# resultado Squid/status HTTP (TCP_DENIED/403 = bloqueado), método, URL, bytes.
# Fica em /var/log/squid/access.log dentro do contêiner (tmpfs; some no `down`).
logformat hdast %{%Y-%m-%dT%H:%M:%S}tg %>a %Ss/%>Hs %rm %ru %<st "%{User-Agent}>h"
access_log stdio:/var/log/squid/access.log hdast
# Sem ICMP: o contêiner não tem CAP_NET_RAW e o "pinger" falharia ruidosamente.
pinger_enable off
cache_log /var/log/squid/cache.log
pid_filename /var/run/squid/squid.pid
coredump_dir /var/spool/squid

# ------------------------------------------------------------------ ACLs
# Política regenerável por execução (somente leitura neste contêiner).
acl allowed_ports        port      "/etc/squid/policy/allowed-ports.txt"
acl allowed_hosts        dstdomain "/etc/squid/policy/allowlist.txt"
acl allowed_private_hosts dstdomain "/etc/squid/policy/allowlist-private.txt"

# Destinos que nunca são alcançados por nome de domínio comum: rede privada,
# loopback, link-local (inclui metadados de nuvem 169.254.169.254), CGNAT e
# multicast/reservado. A checagem é feita sobre o IP RESOLVIDO, o que também
# barra um nome público que aponte para endereço interno (DNS rebinding).
acl forbidden_ranges dst 0.0.0.0/8 10.0.0.0/8 100.64.0.0/10 127.0.0.0/8 169.254.0.0/16 172.16.0.0/12 192.0.0.0/24 192.168.0.0/16 198.18.0.0/15 224.0.0.0/4 240.0.0.0/4
acl forbidden_ranges dst ::1 fc00::/7 fe80::/10 ff00::/8

# Host dado como IP literal não passa: a lista é por nome, e IP literal
# contornaria a leitura do que foi autorizado.
acl ip_literal dstdom_regex -i ^[0-9.]+$ ^\[?[0-9a-f]*:[0-9a-f:.]*\]?$

# ------------------------------------------------------ Regras (em ordem)
# 1. Porta fora da lista: nega (vale também para CONNECT).
http_access deny !allowed_ports
# 2. IP literal: nega.
http_access deny ip_literal
# 3. Exceção explícita para serviços internos (hoje: o alvo do lab). Só nomes
#    listados em allowlist-private.txt passam por aqui.
http_access allow allowed_private_hosts
# 4. Qualquer outro destino que resolva para faixa proibida: nega.
http_access deny forbidden_ranges
# 5. Hosts do escopo autorizado.
http_access allow allowed_hosts
# 6. Resto: nega. O padrão é negar.
http_access deny all
