services:
  oast-gateway:
    image: alpine/socat:1.8.1.3@sha256:e8a6e8868a8e6e01d9c2c321a8f8d4474d2d741d962462e5c5a124a8e66a0055
    user: "65534:65534"
    entrypoint: ["socat"]
    command: ["-d", "-d", "TCP-LISTEN:8090,fork,reuseaddr", "TCP:zap:8090"]
    networks: [zap_net, oast_net]
    restart: "no"
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    mem_limit: 64m
    pids_limit: 128

networks:
  oast_net:
    name: ${HDAST_OAST_NETWORK:-hdast_oast_net}
    internal: true
