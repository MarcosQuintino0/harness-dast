# Regras de dados da Clinica Piloto (schema v1, docs/reference/data-rules-yml.md). Dados sinteticos.
schema_version: 1
rules:
  - match: { field: cpf }
    generator: br.cpf
    unique: true
  - match: { field: email }
    generator: email
    args: { domain: "teste.exemplo.com.br" }
    unique: true
  - match: { field: codigo }
    generator: numeric
    args: { digits: 8 }
    unique: true
  # Nascimento precisa estar no passado (o valor implicito de "date" seria hoje).
  - match: { field: dataNascimento }
    generator: date
    args: { min_offset_days: -20000, max_offset_days: -7000 }
  # Consulta precisa estar no futuro.
  - match: { field: dataHora }
    generator: datetime
    args: { min_offset_days: 30, max_offset_days: 365 }
  - match: { operation: criarConsulta, field: valor }
    generator: number
    args: { min: 50, max: 500, decimals: 2 }
  # CRM NNNNNNN-UF unico por execucao (7 digitos: o prefixo da etiqueta muda entre execucoes).
  - match: { operation: criarMedico, field: crm }
    generator: br.crm
    args: { digits: 7, uf: SP }
    unique: true
  # Documento de semente (lab/pilot/documentos); o nome sorteado nao existiria (404).
  - match: { operation: baixarDocumento, field: arquivo }
    generator: constant
    args: { value: orientacoes-pos-consulta.txt }
  # O implicito seria o primeiro valor do enum (AGENDADA), transicao que o alvo recusa (409).
  - match: { operation: atualizarStatusConsulta, field: status }
    generator: constant
    args: { value: REALIZADA }
  # Parametros de caminho das falhas H8 a H10 (V1.1): valores que existem na semente, para o pedido base dar 200.
  - match: { operation: buscarConvenioPorCodigo, field: codigo }
    generator: constant
    args: { value: "00000001" }
  - match: { operation: baixarArquivo, field: nome }
    generator: constant
    args: { value: laudo-0001.txt }
  - match: { operation: buscarMedicoPorCrm, field: crm }
    generator: constant
    args: { value: 12345-SP }
  # Paginacao (V1.1, authz): o valor sorteado de `page` cai numa pagina vazia (items: []) e o teste de exposicao
  # excessiva nao teria item para comparar com o esquema. Pagina 0 e tamanho pequeno devolvem a semente.
  - match: { field: page }
    generator: integer
    args: { min: 0, max: 0 }
  - match: { field: size }
    generator: integer
    args: { min: 5, max: 10 }
